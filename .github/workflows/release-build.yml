name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach the binaries to"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 is pinned rather than ubuntu-latest: the
          # Linux binary carries the glibc it was built against, and
          # a newer image would raise that floor without improving
          # anything for the user.
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          # Both macOS architectures are shipped. macos-15 is the
          # current arm64 image and macos-15-intel the x64 one;
          # macos-latest is arm64 and moves with the macOS release.
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          # 3.10 is the minimum supported version, so the binaries run
          # on the oldest Python the project supports and on every
          # newer release.
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt "pyinstaller>=6.0,<7.0"

      - name: Build executables
        run: python build_executables.py --suffix ${{ matrix.platform }}

      - name: Record checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > "wp-ssh-backup-${{ matrix.platform }}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wp-ssh-backup-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

      - name: Attach binaries to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true