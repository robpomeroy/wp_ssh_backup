name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          pyflakes *.py tests/*.py

      - name: Run offline tests
        run: pytest -m "not live"

  build:
    name: Build / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt "pyinstaller>=6.0,<7.0"

      # The release workflow builds the same executables from the same
      # script. Building them on every pull request means a broken
      # binary is caught here rather than after a release is published.
      - name: Build executables
        run: python build_executables.py --suffix ${{ matrix.platform }}

      - name: Smoke test the executables
        shell: bash
        run: |
          cd dist
          count=0
          for exe in *-${{ matrix.platform }}*; do
            echo "Running $exe"
            "./$exe" --version
            count=$((count + 1))
          done
          if [ "$count" -ne 3 ]; then
            echo "Expected 3 executables, found $count" >&2
            exit 1
          fi
